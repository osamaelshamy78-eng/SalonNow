name: Apply SalonNow navigation fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply SalonNow navigation fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation and claim flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          start=s.index('function App(){')
          end=s.index('function Header', start)
          new_app=r'''function App(){const[path,setPath]=useState(location.pathname),[lang,setLang]=useState(localStorage.getItem('salon_lang')||'en'),[session,setSession]=useState(null),[salons,setSalons]=useState([]),[gender,setGender]=useState('all'),[emirate,setEmirate]=useState('all'),[q,setQ]=useState(''),[selected,setSelected]=useState(null),[services,setServices]=useState([]),[auth,setAuth]=useState(null),[owner,setOwner]=useState(null),[pendingClaim,setPendingClaim]=useState(null),[toast,setToast]=useState('');const t=T[lang];
useEffect(()=>{document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;localStorage.setItem('salon_lang',lang)},[lang]);
useEffect(()=>{supabase.auth.getSession().then(({data})=>setSession(data.session));const{data}=supabase.auth.onAuthStateChange((_,s)=>setSession(s));return()=>data.subscription.unsubscribe()},[]);
useEffect(()=>{load()},[session]);
useEffect(()=>{if(toast){const z=setTimeout(()=>setToast(''),3500);return()=>clearTimeout(z)}},[toast]);
useEffect(()=>{const onPop=()=>{if(auth||owner){const url=selected?`/salon/${selected.id}`:path;history.pushState({salonNow:true},'',url);setAuth(null);setOwner(null);setPendingClaim(null);return}const p=location.pathname;setPath(p);if(p.startsWith('/salon/')){const id=p.split('/')[2];const s=salons.find(x=>String(x.id)===id);if(s)openSalonData(s)}else setSelected(null)};window.addEventListener('popstate',onPop);return()=>window.removeEventListener('popstate',onPop)},[auth,owner,selected,path,salons]);
useEffect(()=>{if(path.startsWith('/salon/')&&salons.length&&!selected){const id=path.split('/')[2];const s=salons.find(x=>String(x.id)===id);if(s)openSalonData(s)}},[path,salons,selected]);
async function load(){const{data,error}=await supabase.from('salon_directory').select('*').order('name');if(!error)setSalons(data||[])}
async function openSalonData(s){setSelected(s);const{data}=await supabase.from('services').select('id,name,price,duration_minutes').eq('salon_id',s.id).eq('is_active',true).order('name');setServices(data||[])}
async function openSalon(s){history.pushState({salonNow:true,view:'salon',id:s.id},'',`/salon/${s.id}`);setPath(`/salon/${s.id}`);await openSalonData(s)}
function goHome(){history.pushState({salonNow:true,view:'home'},'','/');setPath('/');setSelected(null);setServices([])}
function nav(p){history.pushState({salonNow:true,view:p},'',p);setPath(p);setSelected(null);setServices([])}
function startClaim(s){if(session){setOwner({type:'claim',salon:s});return}setPendingClaim(s);setAuth('signin')}
function onAuthDone(){setAuth(null);if(pendingClaim){const s=pendingClaim;setPendingClaim(null);setOwner({type:'claim',salon:s})}}
async function signOut(){await supabase.auth.signOut();setSession(null);setPendingClaim(null)}
const visible=useMemo(()=>salons.filter(s=>(gender==='all'||s.gender===gender)&&(emirate==='all'||s.emirate===emirate)).map(s=>({...s,_score:fuzzy(q,s.name)})).filter(s=>!q||s._score>0).sort((a,b)=>b._score-a._score),[salons,gender,emirate,q]);
const page=path==='/privacy'||path==='/terms'||path==='/data-sharing'?<Policy type={path.slice(1)} t={t} onBack={goHome}/>:selected?<Profile salon={selected} services={services} session={session} t={t} lang={lang} onBack={goHome} onAuth={()=>setAuth('signin')} onClaim={()=>startClaim(selected)}/>:<><Header session={session} t={t} onAuth={()=>setAuth('signin')} onSignOut={signOut} onLang={()=>setLang(lang==='en'?'ar':'en')} onAdd={()=>setOwner({type:'add'})}/><main className="page"><section className="hero"><span className="eyebrow">LIVE QUEUE</span><h1>{lang==='ar'?'اعرف وقت الانتظار قبل ما تروح.':<>Know the wait<br/><em>before you go.</em></>}</h1><p>{lang==='ar'?'ابحث عن الصالونات في دبي والشارقة وعجمان وغيرها، واعرف حالة الطابور عندما تكون متاحة.':'Find salons across Dubai, Sharjah, Ajman and more. See live queue status when the salon is connected.'}</p></section><section className="filters"><div className="searchBox"><Search size={18}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder={t.search}/></div><select value={emirate} onChange={e=>setEmirate(e.target.value)}><option value="all">{t.allEmirates}</option>{emirates.map(x=><option key={x} value={x}>{lang==='ar'?arEm[x]:x}</option>)}</select></section><div className="tabs"><button className={gender==='all'?'active':''} onClick={()=>setGender('all')}>{t.all}</button><button className={gender==='men'?'active':''} onClick={()=>setGender('men')}>{t.men}</button><button className={gender==='women'?'active':''} onClick={()=>setGender('women')}>{t.women}</button></div><div className="sectionHead"><div><span className="eyebrow">{t.discover.toUpperCase()}</span><h2>{lang==='ar'?'الصالونات':'Salons'}</h2></div><button className="addLink" onClick={()=>setOwner({type:'add'})}><Plus size={15}/>{t.add}</button></div><section className="grid">{visible.map(s=><Card key={s.id} s={s} t={t} lang={lang} onClick={()=>openSalon(s)}/>)}</section><footer><button onClick={()=>nav('/privacy')}>{t.privacy}</button><button onClick={()=>nav('/terms')}>{t.terms}</button><button onClick={()=>nav('/data-sharing')}>{t.data}</button><span>© SalonNow</span></footer></main><nav className="bottom"><button className="active"><Store/> {t.discover}</button><button onClick={()=>setAuth('signin')}><UserRound/> {t.account}</button></nav></>;
return <div className="app">{page}{auth&&<Auth mode={auth} t={t} lang={lang} onClose={()=>{setAuth(null);setPendingClaim(null)}} onSwitch={setAuth} onDone={onAuthDone}/>} {owner&&<Owner form={owner} session={session} t={t} lang={lang} onClose={()=>setOwner(null)} onAuth={()=>{setOwner(null);setAuth('signin')}} onDone={m=>{setOwner(null);setToast(m);load()}}/>}{toast&&<div className="toast"><CheckCircle2 size={17}/>{toast}</div>}</div>}
'''
          p.write_text(s[:start]+new_app+s[end:])
          PY
      - name: Commit and remove patch workflow
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/main.jsx .github/workflows/apply-navigation-fix.yml
          git rm .github/workflows/apply-navigation-fix.yml
          git commit -m "Apply SalonNow navigation fix"
          git push